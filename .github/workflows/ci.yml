name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace-ci
          POSTGRES_DB: marketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketplace:marketplace-ci@localhost:5432/marketplace
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-a-secret
      MFA_ENCRYPTION_KEY: ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy1sb25nISE=
      WEB_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://admin.localhost:3000
      FILE_SCANNER: sandbox-eicar
      API_ORIGIN: http://localhost:4000
      PAYMENT_MODE: mock
      EMAIL_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Migration dry run (status before deploy)
        run: pnpm db:migrate:status || true
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm test:e2e
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
