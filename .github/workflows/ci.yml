name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace-ci
          POSTGRES_DB: marketplace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # Local mail catcher: emails never leave the runner.
      mail:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketplace:marketplace-ci@localhost:5432/marketplace
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-a-secret
      MFA_ENCRYPTION_KEY: ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy1sb25nISE=
      WEB_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://admin.localhost:3000
      FILE_SCANNER: sandbox-eicar
      API_ORIGIN: http://localhost:4000
      PAYMENT_MODE: mock
      EMAIL_PROVIDER: smtp-dev
      SMTP_URL: smtp://localhost:1025
      STORAGE_ENDPOINT: http://localhost:8333
      STORAGE_REGION: me-central-1
      STORAGE_BUCKET: marketplace-private-ci
      STORAGE_ACCESS_KEY: ci-only-access-key
      STORAGE_SECRET_KEY: ci-only-secret-key
      RATE_LIMIT_SCALE: '50'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start S3-compatible storage (SeaweedFS, private bucket)
        run: |
          docker run -d --name storage -p 8333:8333 chrislusf/seaweedfs:3.97 server -s3 -dir=/data -ip.bind=0.0.0.0
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333 && break; sleep 1; done
      - name: Resolve the admin origin host (admin.localhost) for all browsers
        run: echo "127.0.0.1 admin.localhost" | sudo tee -a /etc/hosts
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Migration dry run (status before deploy)
        run: pnpm db:migrate:status || true
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Unit and integration tests
        run: pnpm test
      - name: OpenAPI document is up to date
        run: pnpm --filter @app/contracts openapi && git diff --exit-code docs/api/openapi.json
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
      - name: Production refuses to start without live integrations (T38)
        run: pnpm check:production-refusal
      - name: Seed fictional development data
        run: pnpm db:seed
      - name: Install Playwright browsers (Chromium and WebKit)
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium webkit
      - name: Browser E2E (Chromium, WebKit, phone layouts)
        run: pnpm test:e2e --project=chromium --project=mobile-360 --project=webkit --project=mobile-safari
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
