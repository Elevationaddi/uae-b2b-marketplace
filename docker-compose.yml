# Local development services only. Not a production deployment.
name: marketplace

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace-dev-only
      POSTGRES_DB: marketplace
      TZ: UTC
      PGTZ: UTC
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development (private by default).
  storage:
    image: chrislusf/seaweedfs:3.97
    command: ['server', '-s3', '-dir=/data', '-ip.bind=0.0.0.0']
    ports: ['127.0.0.1:8333:8333']
    volumes: [storagedata:/data]

  # Local mail catcher: nothing leaves the machine. UI at http://localhost:8025
  mail:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

volumes:
  pgdata:
  redisdata:
  storagedata:
